services:
  app:
    image: vibhanshuthakurdocker/candlesmart-private:cs-app_1.0.23
    container_name: candlesmart-web
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
      - path: /opt/app/.env.production
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      application: candlesmart
      environment: production
      service: app
    logging:
      driver: gcplogs
      options:
        gcp-project: "candlesmart-101"
        labels: "application,environment,service"
        cache-disabled: "true"
        mode: "non-blocking"
        max-buffer-size: "1m"

  worker:
    image: vibhanshuthakurdocker/candlesmart-private:cs-worker_1.0.23
    container_name: candlesmart-worker
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
      - path: /opt/app/.env.production
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    labels:
      application: candlesmart
      environment: production
      service: worker
    logging:
      driver: gcplogs
      options:
        gcp-project: "candlesmart-101"
        labels: "application,environment,service"
        cache-disabled: "true"
        mode: "non-blocking"
        max-buffer-size: "1m"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - candlesmart_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    # Reload every 6h so a certificate renewed by the certbot service is picked up.
    command: /bin/sh -c 'while :; do sleep 6h; nginx -s reload; done & exec nginx -g "daemon off;"'
    depends_on:
      - app

  certbot:
    # Keep on the same release as certbot_image in infra/terraform/variables.tf.
    image: certbot/certbot:v5.9.0
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Renews only within 30 days of expiry; checks twice a day.
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'

volumes:
  candlesmart_redis_data:
  candlesmart_mongo_data:
  # Created by the VM startup script, which issues the first certificate into it.
  letsencrypt:
    external: true
    name: candlesmart_letsencrypt
  certbot_www:
