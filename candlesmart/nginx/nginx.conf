server {
    listen 80;
    server_name candlesmart.sort-tree.com;

    # Let's Encrypt renewal challenges (written by the certbot service).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name candlesmart.sort-tree.com;

    ssl_certificate     /etc/letsencrypt/live/candlesmart.sort-tree.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/candlesmart.sort-tree.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}
